          "pluginVersion": "13.0.1",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max_over_time(vllm:num_requests_waiting{model_name=\"$model_name\"}[$__range])",
              "legendFormat": "Peak Waiting",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Peak Waiting",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Total downtime/idle periods (zero running + zero waiting) in the selected range. Idle usage means we're not getting a good ROI on GPUs.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 60
                  },
                  {
                    "color": "red",
                    "value": 300
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 14
          },
          "id": 14,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.0.1",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "count_over_time(\n    ((vllm:num_requests_running{model_name='$model_name'} + vllm:num_requests_waiting{model_name='$model_name'}) == 0)[$__range:5s]\n  ) * 5",
              "legendFormat": "Downtime",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Idle duration (Total)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Total number of completed requests in the selected time range.",
          "fieldConfig": {
            "defaults": {
              "color": {
