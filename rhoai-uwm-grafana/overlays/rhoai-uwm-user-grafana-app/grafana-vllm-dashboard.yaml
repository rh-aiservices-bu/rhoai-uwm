              "editorMode": "code",
              "expr": "sum(increase(vllm:request_success_total{model_name=\"$model_name\"}[$__range:]))",
              "instant": true,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Total Requests",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
